version: "3.9"

services:
  web:
    build: .
    container_name: clothstore-fastapi

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: always

  db:
    image: postgres:15-alpine
    container_name: clothstore-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: clothstore-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5051:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      db:
        condition: service_healthy

    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clothstore-rabbitmq

    ports:
      - "5673:5672"
      - "15673:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: always

  worker:
    build: .
    container_name: clothstore-celery

    env_file:
      - .env

    command: celery -A src.core.celery:celery_app worker --loglevel=info  

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: always

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data: 